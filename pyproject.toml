[project]
name = "unsupervised-finetune"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "torch>=2.15.0",
    "transformers>=5.0",
]

[project.optional-dependencies]
server = [
    "flash-linear-attention>=0.6.0 ; sys_platform == 'linux'",
]
